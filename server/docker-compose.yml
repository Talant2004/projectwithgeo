services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GEOSERVER_DB_USER: ${GEOSERVER_DB_USER}
      GEOSERVER_DB_PASSWORD: ${GEOSERVER_DB_PASSWORD}
    volumes:
      - ${DATA_DIR:-./data}/postgis:/var/lib/postgresql/data
      - ./postgis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  geoserver:
    image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION:-2.28.5}
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      # 127.0.0.1 — only this PC; 0.0.0.0 — also from the local network (uploading from a workstation).
      - "${GEOSERVER_BIND:-127.0.0.1}:8080:8080"
    environment:
      SKIP_DEMO_DATA: "true"
      # GEOSERVER_ADMIN_PASSWORD is deliberately not passed: the image then rewrites
      # users.xml on every start and drops all other users. setup sets the password.
      GEOSERVER_CSRF_WHITELIST: ${PUBLIC_HOSTNAME}
      EXTRA_JAVA_OPTS: "-Xms1g -Xmx${GEOSERVER_MAX_HEAP:-2g}"
    volumes:
      - ${DATA_DIR:-./data}/geoserver_data:/opt/geoserver_data
      - ${DATA_DIR:-./data}/surveys:/data/surveys:ro
      - ${INSPECTOR_LAYERS_HOST_DIR:-./data/inspector_layers}:${INSPECTOR_LAYERS_CONTAINER_DIR:-/data/inspector}:ro

  fieldnav:
    build: ../tools/tiffs/FieldNav
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Сеть дорог только по дельте Или (полный Казахстан не влезает в ОЗУ вместе с GeoServer)
      GPKG_PATH: /data/field_roads_ili.gpkg
      CACHE_PATH: /data/graph_cache_ili.pkl
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_WORKSPACE: inspector_data
    volumes:
      - ../tools/tiffs/FieldNav/field_roads_ili.gpkg:/data/field_roads_ili.gpkg:ro
      - ../tools/tiffs/FieldNav/graph_cache_ili.pkl:/data/graph_cache_ili.pkl:ro
      - ../tools/tiffs/FieldNav/static:/app/static:ro
    mem_limit: 512m

  webapi:
    build: ./webapi
    restart: unless-stopped
    depends_on:
      - geoserver
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
      SURVEYS_HOST_DIR: /data/surveys
      SURVEYS_CONTAINER_DIR: /data/surveys
      TOOLS_DIR: /tools
    volumes:
      - ${DATA_DIR:-./data}/surveys:/data/surveys
      - ../tools:/tools:ro
    mem_limit: 1g

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - geoserver
      - fieldnav
      - webapi
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web:/usr/share/nginx/html:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - gateway
    profiles: ["tunnel"]
